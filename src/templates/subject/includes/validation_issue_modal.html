{% load i18n %}
<div class="subject-form-verification-query-modal-backdrop"
     hidden
     data-validation-issue-modal
     data-language-code="{{ LANGUAGE_CODE }}"
     data-acknowledge-url="{{ validation_issue_acknowledge_url|default:'' }}"
     data-title-en-prefix="Validation issues for field"
     data-title-vi-prefix="Cảnh báo validation cho trường">
    <div class="subject-form-verification-query-modal subject-form-validation-issue-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="subject-form-validation-issue-modal-title">
        <header class="subject-form-verification-query-modal__header">
            <h3 id="subject-form-validation-issue-modal-title"
                class="subject-form-verification-query-modal__title"
                data-validation-issue-modal-title></h3>
        </header>
        <div class="subject-form-verification-query-modal__body">
            <section class="subject-form-verification-query-modal__section">
                <dl class="subject-form-verification-query-modal__facts">
                    <div class="subject-form-verification-query-modal__fact-row">
                        <dt>{% trans "Brief Description" %}</dt>
                        <dd data-validation-issue-modal-brief>
                        </dd>
                    </div>
                    <div class="subject-form-verification-query-modal__fact-row">
                        <dt>{% trans "Value" %}</dt>
                        <dd data-validation-issue-modal-value>
                        </dd>
                    </div>
                </dl>
            </section>
            <section class="subject-form-verification-query-modal__section">
                <table class="subject-form-validation-issue-modal__table">
                    <tbody data-validation-issue-modal-list>
                    </tbody>
                </table>
            </section>
            <section class="subject-form-verification-query-modal__section">
                <h4 class="subject-form-verification-query-modal__subtitle">{% trans "History" %}</h4>
                <div class="subject-form-verification-query-modal__messages"
                     data-validation-issue-history-list>
                    <p class="subject-form-verification-query-modal__empty"
                       data-validation-issue-history-empty>{% trans "No validation issue history." %}</p>
                </div>
            </section>
        </div>
        <footer class="subject-form-validation-issue-modal__footer">
            <div class="subject-form-verification-query-modal__actions">
                {% if validation_issue_show_acknowledge %}
                    <button type="button"
                            class="entity-table__footer-button entity-table__footer-button--primary"
                            data-validation-issue-modal-submit>{% trans "Acknowledge" %}</button>
                {% endif %}
                <button type="button"
                        class="entity-table__footer-button entity-table__footer-button--secondary"
                        data-validation-issue-modal-close>{% trans "Close" %}</button>
            </div>
        </footer>
    </div>
</div>
